name: Verificar PaddleOCR e preparar leitor Kedu

on:
  workflow_dispatch:
    inputs:
      run_worker:
        description: Executar o leitor somente no ambiente OCR autorizado
        type: boolean
        default: false
  # De hora em hora, das 07h40 às 19h40 de Brasília (o cron é em UTC). O GitHub atrasa ou descarta
  # agendamentos em horários cheios; com mais horários a fila é lida no mesmo dia. Fila vazia termina em segundos.
  schedule:
    - cron: '40 10-22 * * *'

permissions:
  contents: read

jobs:
  verificar:
    # Scheduled runs always read the queue; they are skipped while the reader is not enabled.
    if: ${{ !(github.event_name == 'schedule' || inputs.run_worker) || vars.KEDU_OCR_WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ${{ (github.event_name == 'schedule' || inputs.run_worker) && 'kedu-ocr' || 'kedu-ocr-fixtures' }}
    concurrency:
      group: ${{ (github.event_name == 'schedule' || inputs.run_worker) && 'kedu-ocr-worker' || format('kedu-ocr-fixtures-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      OCR_ENGINE: paddle
      READING_CACHE: 'off'
      DOCUMENT_VISION_ENABLED: 'false'
      GEMINI_PAID_DATA_APPROVED: 'false'
      RUN_WORKER: ${{ github.event_name == 'schedule' || inputs.run_worker }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Conferir a fila de OCR
        id: fila
        # Database settings only where the database is used, never during package installation.
        env:
          KEDU_DATABASE: postgres
          KEDU_PG_SCHEMA: ${{ vars.KEDU_PG_SCHEMA }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [[ "$RUN_WORKER" != "true" ]]; then echo "pendentes=fixtures" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ -z "$KEDU_PG_SCHEMA" || -z "$SUPABASE_URL" || -z "$SUPABASE_STORAGE_BUCKET" || -z "$SUPABASE_DATABASE_URL" || -z "$SUPABASE_CA_CERT" || -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "::error::Configuração incompleta no ambiente protegido de OCR."
            exit 1
          fi
          node --import tsx scripts/ocr-pending.ts
      # Without files awaiting OCR, the run ends here instead of installing PaddleOCR.
      - uses: actions/setup-python@v6
        if: ${{ steps.fila.outputs.pendentes != '0' }}
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/ocr/requirements.txt
      - if: ${{ steps.fila.outputs.pendentes != '0' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64 libgomp1 fonts-liberation
          python -m pip install -r server/ocr/requirements.txt
          python -u server/ocr/worker.py --setup
      - if: ${{ steps.fila.outputs.pendentes != '0' }}
        run: node --import tsx scripts/check-paddleocr.ts
      - name: Processar a fila de OCR
        if: ${{ env.RUN_WORKER == 'true' && steps.fila.outputs.pendentes != '0' }}
        env:
          NODE_ENV: production
          KEDU_ROLE: worker
          KEDU_WORKER_DEFERRED_OCR_ONLY: 'true'
          KEDU_DATABASE: postgres
          KEDU_PG_SCHEMA: ${{ vars.KEDU_PG_SCHEMA }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GLPI_SYNC_INTERVAL_MINUTES: '0'
          GLPI_SYNC_TIMES: ''
          DEMO_SEED: 'false'
          READING_CACHE: ''
        run: npm run worker
