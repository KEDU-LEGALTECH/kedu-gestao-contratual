# Local deployment only. Demonstration data requires explicit DEMO_SEED=true.
services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:3001"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /app/data/kedu.sqlite
      # Demonstration by default. Real read-only GLPI only with GLPI_MODE=real and tokens in the local .env.
      GLPI_MODE: ${GLPI_MODE:-demo}
      GLPI_URL: ${GLPI_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
      GLPI_GROUPS: ${GLPI_GROUPS:-JURIDICO CONTRATOS;JURIDICO REVISÃO}
      GLPI_GROUP_IDS: ${GLPI_GROUP_IDS:-}
      GLPI_SYNC_INTERVAL_MINUTES: ${GLPI_SYNC_INTERVAL_MINUTES:-0}
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Kedu-demo-2026!}
      TZ: America/Sao_Paulo
    volumes:
      - kedu-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  kedu-data:
